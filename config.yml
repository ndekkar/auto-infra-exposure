# === Global Configuration ===

# Path to the Area of Interest (AOI) shapefile
aoi: "../data/tajik/aoi.shp"

dem:
#   input: "../data/tajik/dem_tjk.tif"
  input: null

# Path to infrastructure 
infrastructure_inputs:
  points:
    transformer: "../data/tajik/TJK_Transformers.shp"
    tower: "../data/tajik/TJK_Towers.shp"
    substations: "../data/tajik/TJK_Substations.shp"
    existing: null      

  lines:
    lv: "../data/tajik/TJK_LV_Lines.shp"
    hv: "../data/tajik/TJK_HV_Lines.shp"
    existing: null


# Directory where all outputs will be saved
output_dir: "../data/resultwind"


# === Hazard Layers Configuration ===
hazards:

  pluvial_flood:
    active: false
    input: "../data/tajik/plu.tif"        
    threshold: 0.3                

  fluvial_flood:
    active: false
    input: "../data/tajik/flu.tif"       
    threshold: 0.5

  landslide:
    active: false
    input: "../data/landslide.tif"  
    threshold: 0.3

  earthquake:
    active: false
    input: "../data/earthquacke.tif"   
    threshold: 0.3

  wildfire:
    active: false
    input: "/Users/nassimdekkar/Downloads/GLOBFIRE_burned_area_full_dataset_2002_2023"  # Directory containing wildfire shapefiles
    threshold: 0.5  

  heat:
    active: false
    input: "../data/heat/heat_tajikistan_2010_2024.nc"  # NetCDF file for heat hazard (e.g. Tmax)
    threshold: 35

  cold:
    active: false
    input: "../data/hazards/cold/TNn_mean_2010_2024.tif"
    threshold: -20
    fd_input: "../data/hazards/cold/FD_mean_2010_2024_TAJ.tif"   # <- optionnel
  
  ice:
    active: false
    input: "../data/era5/ice/indicators/era5_ice_indicators_TJK.nc"
    # Thresholds above which infrastructure is considered exposed per indicator
    thresholds:
      freeze_days: 60          # days/year with at least one sub-zero timestep
      freeze_thaw_cycles: 20   # days/year where temperature crosses 0°C within the day
      freezing_rain_days: 10   # days/year with simultaneous precipitation and sub-zero temp
      cold_spell_duration: 14  # maximum consecutive freeze days per year
  
  wind:
    active: true
    input: "../data/era5/wind/indicators/era5_wind_indicators_TJK.nc"
    thresholds:
      max_wind_speed: 20    # m/s at 100m — design wind speed for standard towers
      mean_wind_speed: 8    # m/s at 100m — fatigue load threshold
      high_wind_days: 30    # days/year with ws10 > 15 m/s
      storm_days: 5         # days/year with ws100 > 25 m/s
